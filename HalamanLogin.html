<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refoxx Login</title>
    <link rel="stylesheet" href="LoginStyle.css">
    <script src="scriptLogin.js" defer></script>
    <link rel="icon" type="image/png" href="RefoxxIcon.png">
</head>
<body>
    
<center>
    <form id="formlogin">
        <div class="login">
            <h2> Login </h2>
            <input type="text" id="email" placeholder="E-mail" required>
                <br> <br>
            <input type="password" id="password" placeholder="Password" required>
                <br> <br>
            <a href="" class="forget">Forgot Password?</a>
                <br>
            <button type="submit" class="btn-login" id="login-btn">Login</button>

            <p class="register"> Don't have an account? <a href="HalamanRegister.html" class="register">register</a> </p>
        </div>
    </form>
</center>

</body>
</html>
